<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="app-version" content="2026.11.16-0615">
<title>Weiqi Adventure: Go for little learners</title>
<style>
:root {
  --wood: #e9bf73;
  --woodDark: #b9874a;
  --line: #5b3a1a;
  --accent: #ff8a3d;
  --ink: #3b2f2f;
  --bs: max(260px, min(94vw, calc(100vh - 290px), 600px));
}
@supports (height: 100dvh) {
  :root { --bs: max(260px, min(94vw, calc(100dvh - 290px), 600px)); }
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: "Comic Sans MS", "Chalkboard SE", "Comic Neue", "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif;
  color: var(--ink);
  background: linear-gradient(180deg, #c8ecd2 0%, #fff6e0 100%) fixed;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
}
html[lang^="zh"] body { font-family: "Yuanti SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif; }
header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; max-width: 980px; margin: 0 auto; }
header h1 { flex: 1; margin: 0; text-align: center; font-size: clamp(18px, 4.2vw, 30px); }
.btn { font: inherit; font-size: clamp(16px, 3.4vw, 21px); border: 0; border-radius: 999px; padding: 10px 18px;
  background: #fff; color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.15); cursor: pointer; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.icon { padding: 6px 10px; font-size: 24px; line-height: 1.2; }
.btn.lang { font-size: 17px; padding: 8px 12px; min-width: 56px; }
.btn.small { font-size: 15px; padding: 8px 14px; }
.btn:disabled { opacity: .45; cursor: default; }
main { max-width: 980px; margin: 0 auto; padding: 0 12px 28px; }
.row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }

/* Home */
.hello { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 6px 0 18px; }
.panda { font-size: 64px; line-height: 1; cursor: pointer; animation: bob 2.4s ease-in-out infinite; }
.speech { background: #fff; border-radius: 22px; padding: 12px 16px; font-size: clamp(16px, 3.4vw, 21px);
  box-shadow: 0 4px 0 rgba(0,0,0,.1); max-width: 560px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.card { background: #fff; border-radius: 22px; padding: 14px 10px; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.12);
  cursor: pointer; position: relative; transition: transform .15s; }
.card:hover { transform: translateY(-3px) rotate(-1deg); }
.card .ic { font-size: 50px; height: 66px; display: flex; align-items: center; justify-content: center; }
.card .t { font-size: 17px; font-weight: bold; margin: 6px 0 8px; }
.card.locked { filter: grayscale(1); opacity: .55; }
.card.shake, .season.shake { animation: shake .4s; }
.card .badge { position: absolute; top: -10px; right: -6px; font-size: 34px; animation: bob 2s ease-in-out infinite; }
.pips { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; }
.pip { width: 12px; height: 12px; border-radius: 50%; background: #e4e4e4; }
.pip.on { background: #ffc107; }
.seasons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 0 0 16px; }
.season { font: inherit; font-size: clamp(15px, 3.2vw, 19px); border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer;
  background: rgba(255,255,255,.6); color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.1); }
.season.on { background: #fff; outline: 3px solid var(--accent); }
.season.locked { opacity: .55; }
.cnt { font-size: .8em; opacity: .7; margin-left: 4px; }

/* Story */
.story { background: #fff; border-radius: 28px; padding: 22px; max-width: 660px; margin: 10px auto; text-align: center;
  box-shadow: 0 6px 0 rgba(0,0,0,.12); }
.story .hero { font-size: 110px; line-height: 1.15; animation: bob 2.4s ease-in-out infinite; }
.story h2 { margin: 6px 0; font-size: clamp(22px, 5vw, 32px); }
.story p { font-size: clamp(17px, 3.8vw, 23px); line-height: 1.5; }

/* Puzzle screen */
.topline { display: flex; align-items: center; justify-content: space-between; gap: 8px; max-width: var(--bs); margin: 0 auto; flex-wrap: wrap; }
.chap { font-weight: bold; font-size: clamp(16px, 3.4vw, 20px); display: flex; align-items: center; gap: 6px; cursor: pointer; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dots button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: #fff; box-shadow: 0 2px 0 rgba(0,0,0,.15);
  font: inherit; font-size: 13px; cursor: pointer; padding: 0; color: var(--ink); }
.dots button.done { background: #ffd54f; }
.dots button.cur { outline: 3px solid var(--accent); }
.dots button:disabled { opacity: .45; cursor: default; }
.bubble { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 20px; padding: 8px 12px;
  box-shadow: 0 4px 0 rgba(0,0,0,.1); margin: 8px auto 12px; max-width: var(--bs); min-height: 68px; }
.bubble .panda { font-size: 40px; animation: none; }
.bubble .msg { flex: 1; font-size: clamp(15px, 3.3vw, 20px); line-height: 1.35; }
.boardwrap { position: relative; width: var(--bs); height: var(--bs); margin: 0 auto; }
.goban { display: block; width: 100%; height: 100%; border-radius: 14px; box-shadow: 0 8px 0 rgba(0,0,0,.18); touch-action: manipulation; }
.goban .hit { fill: transparent; cursor: pointer; }
.goban .stone { transform-box: fill-box; transform-origin: center; }
.goban .stone.pop { animation: pop .3s; }
.goban .ghost { opacity: .5; animation: fade .55s forwards; }
.goban .glow { fill: none; stroke: #ffd400; stroke-width: 12; animation: pulse 1s infinite; }
.goban .tring { fill: none; stroke: #ff6b00; stroke-width: 6; stroke-dasharray: 14 10; animation: spinring 6s linear infinite; transform-box: fill-box; transform-origin: center; }
.goban .bad { animation: fade 1.1s forwards; }
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.floater { position: absolute; transform: translate(-50%, -50%); font-size: calc(var(--bs) * 0.06); font-weight: bold;
  animation: floatup 1s forwards; white-space: nowrap; text-shadow: 0 0 4px #fff, 0 2px 0 #fff; }
.controls { display: flex; gap: 10px; justify-content: center; align-items: center; margin-top: 18px; flex-wrap: wrap; }
.info { font-size: 18px; min-width: 100px; text-align: center; }

/* Modal + confetti */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: #fff; border-radius: 28px; padding: 22px; max-width: 520px; width: 100%; text-align: center; animation: pop .35s; }
.modal .big { font-size: 84px; line-height: 1.1; }
.modal .sticker { font-size: 120px; line-height: 1.1; animation: spin 1.2s ease-out; display: inline-block; }
.modal h2 { margin: 8px 0; font-size: clamp(22px, 5vw, 30px); }
.modal p { font-size: 18px; }
.rating { font-size: 40px; letter-spacing: 4px; }
.confetti { position: fixed; top: -60px; z-index: 60; pointer-events: none; animation: fall linear forwards; }

/* Sticker book + guide */
h2.page { text-align: center; }
.season-head { margin: 18px 0 10px; text-align: center; }
.stickers { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.stk { background: #fff; border-radius: 20px; padding: 12px; text-align: center; box-shadow: 0 4px 0 rgba(0,0,0,.1); cursor: pointer; }
.stk .s { font-size: 62px; line-height: 1.2; }
.stk.no .s { opacity: .35; filter: grayscale(1); }
.stk .n { font-size: 14px; }
.stk .s.pop { animation: pop .35s; }
.guide { background: #fff; border-radius: 24px; padding: 18px 24px; box-shadow: 0 6px 0 rgba(0,0,0,.1);
  font-family: "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; user-select: text; -webkit-user-select: text; line-height: 1.6; font-size: 16px; }
.guide h2 { margin-top: 4px; }
.guide h3 { margin: 22px 0 6px; }
.guide table { border-collapse: collapse; width: 100%; font-size: 15px; }
.guide th, .guide td { border-bottom: 1px solid #eee; padding: 6px 8px; text-align: left; vertical-align: top; }
.guide th { background: #fff4d9; }
.guide tr.season-row th { background: #dff3e5; font-size: 16px; }
.guide .settings { display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: center; }
.guide label { display: inline-flex; align-items: center; gap: 6px; }
.guide select { font: inherit; }
.guide .small { font-size: 14px; color: #666; }

@media (max-width: 520px) {
  header { gap: 5px; padding: 6px 6px; }
  header h1 { font-size: 17px; white-space: nowrap; }
  .btn.icon { padding: 4px 7px; font-size: 20px; }
  .btn.lang { font-size: 14px; padding: 6px 8px; min-width: 0; }
}
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes bob { 50% { transform: translateY(-6px); } }
@keyframes pulse { 50% { opacity: .3; } }
@keyframes fade { to { opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes floatup { to { transform: translate(-50%, -170%); opacity: 0; } }
@keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }
@keyframes spin { 0% { transform: scale(0) rotate(-360deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes spinring { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <button class="btn icon" id="hHome">🏠</button>
  <h1 id="hTitle">⚫ Weiqi Adventure</h1>
  <button class="btn lang" id="hLang">中文</button>
  <button class="btn icon" id="hSound">🔊</button>
  <button class="btn icon" id="hStick">📒</button>
  <button class="btn icon" id="hGuide">👪</button>
</header>
<main id="app"></main>
<script id="engine">
// Go (Weiqi) rules for small boards, shared by the app and tools/verify-puzzles.js so the two can't disagree.
// A board is { n, s } where s[i] is 0 (empty), 1 (black) or 2 (white); i = row * n + column, row 0 at the top.
// Points are named like real boards: columns A-T without I, rows counted from the bottom (C3, D4...).
var Go = (function () {
  'use strict';
  var LETTERS = 'ABCDEFGHJKLMNOPQRST';
  var BLACK = 1, WHITE = 2;
  function other(c) { return 3 - c; }
  function idx(n, p) {
    var x = LETTERS.indexOf(String(p).charAt(0).toUpperCase()), y = parseInt(String(p).slice(1), 10);
    if (x < 0 || x >= n || !(y >= 1 && y <= n)) throw new Error('Bad point ' + p + ' on a ' + n + 'x' + n + ' board');
    return (n - y) * n + x;
  }
  function name(n, i) { return LETTERS[i % n] + (n - Math.floor(i / n)); }
  function make(n, black, white) {
    var s = [];
    for (var i = 0; i < n * n; i++) s.push(0);
    (black || []).forEach(function (p) { s[idx(n, p)] = BLACK; });
    (white || []).forEach(function (p) { var i = idx(n, p); if (s[i]) throw new Error('Two stones on ' + p); s[i] = WHITE; });
    return { n: n, s: s };
  }
  function copy(b) { return { n: b.n, s: b.s.slice() }; }
  var NB = {}, DG = {};
  function table(n, cache, steps) {
    if (cache[n]) return cache[n];
    var t = [];
    for (var i = 0; i < n * n; i++) {
      var x = i % n, y = Math.floor(i / n), a = [];
      steps.forEach(function (d) { var X = x + d[0], Y = y + d[1]; if (X >= 0 && X < n && Y >= 0 && Y < n) a.push(Y * n + X); });
      t.push(a);
    }
    return (cache[n] = t);
  }
  function nbrs(n, i) { return table(n, NB, [[-1, 0], [1, 0], [0, -1], [0, 1]])[i]; }
  function diags(n, i) { return table(n, DG, [[-1, -1], [1, -1], [-1, 1], [1, 1]])[i]; }
  function stars(n) {
    var p = n === 9 ? ['C3', 'G3', 'E5', 'C7', 'G7'] : n === 7 ? ['C3', 'E3', 'D4', 'C5', 'E5'] : n === 5 ? ['C3'] : [];
    return p.map(function (q) { return idx(n, q); });
  }

  // A group: connected stones of one color, and its liberties (empty points next to it).
  function group(b, i) {
    var c = b.s[i];
    if (!c) return null;
    var seen = {}, libs = {}, stones = [i], stack = [i];
    seen[i] = 1;
    while (stack.length) {
      var k = stack.pop(), ns = nbrs(b.n, k);
      for (var j = 0; j < ns.length; j++) {
        var q = ns[j], v = b.s[q];
        if (!v) libs[q] = 1;
        else if (v === c && !seen[q]) { seen[q] = 1; stones.push(q); stack.push(q); }
      }
    }
    return { color: c, stones: stones, libs: Object.keys(libs).map(Number) };
  }
  function libs(b, i) { return b.s[i] ? group(b, i).libs.length : 0; }
  function groups(b, c) {
    var seen = {}, out = [];
    for (var i = 0; i < b.s.length; i++) {
      if (b.s[i] !== c || seen[i]) continue;
      var g = group(b, i);
      g.stones.forEach(function (k) { seen[k] = 1; });
      out.push(g);
    }
    return out;
  }

  // Play a stone. ko = the point the player may not take back on this turn (-1 if none).
  // Returns { ok, why: 'taken' | 'ko' | 'suicide' } or { ok, b, captured, ko, libs }.
  function play(b, i, c, ko) {
    if (b.s[i]) return { ok: false, why: 'taken' };
    if (i === ko) return { ok: false, why: 'ko' };
    var nb = copy(b), captured = [];
    nb.s[i] = c;
    nbrs(b.n, i).forEach(function (j) {
      if (nb.s[j] !== other(c)) return;
      var g = group(nb, j);
      if (!g.libs.length) g.stones.forEach(function (k) { nb.s[k] = 0; captured.push(k); });
    });
    var me = group(nb, i);
    if (!me.libs.length) return { ok: false, why: 'suicide' };
    var nk = captured.length === 1 && me.stones.length === 1 && me.libs.length === 1 ? captured[0] : -1;
    return { ok: true, b: nb, captured: captured, ko: nk, libs: me.libs.length };
  }
  function legal(b, c, ko) {
    var out = [];
    for (var i = 0; i < b.s.length; i++) if (!b.s[i] && play(b, i, c, ko).ok) out.push(i);
    return out;
  }

  // Eyes: an empty point surrounded by one color. It is a real eye unless the opponent holds too many of its
  // corners (one in the middle of the board, none on the edge).
  function realEye(b, i, c) {
    if (b.s[i]) return false;
    var ns = nbrs(b.n, i);
    for (var k = 0; k < ns.length; k++) if (b.s[ns[k]] !== c) return false;
    var bad = diags(b.n, i).filter(function (d) { return b.s[d] === other(c); }).length;
    return ns.length < 4 ? bad === 0 : bad <= 1;
  }
  function eyes(b, i) {
    var g = group(b, i);
    return g ? g.libs.filter(function (l) { return realEye(b, l, g.color); }) : [];
  }
  function alive(b, i) { return b.s[i] && eyes(b, i).length >= 2; }

  // Empty areas and who surrounds them: owner 1 or 2 if only that color touches it, else 0.
  function regions(b) {
    var seen = {}, out = [];
    for (var i = 0; i < b.s.length; i++) {
      if (b.s[i] || seen[i]) continue;
      var pts = [], touch = {}, stack = [i];
      seen[i] = 1;
      while (stack.length) {
        var k = stack.pop();
        pts.push(k);
        nbrs(b.n, k).forEach(function (j) {
          if (b.s[j]) touch[b.s[j]] = 1;
          else if (!seen[j]) { seen[j] = 1; stack.push(j); }
        });
      }
      out.push({ points: pts, owner: touch[1] && !touch[2] ? 1 : touch[2] && !touch[1] ? 2 : 0 });
    }
    return out;
  }
  function land(b, c) {
    var out = [];
    regions(b).forEach(function (r) { if (r.owner === c) out = out.concat(r.points); });
    return out.sort(function (x, y) { return x - y; });
  }

  // ---------- chasing: can the attacker capture one of the target stones? ----------
  // Used for capture-in-a-few-moves puzzles (ladder, net, snapback, double atari) and for "is my group safe?".
  // The attacker plays on the targets' liberties (and next to them if near is set, for nets); the defender extends,
  // captures attacking stones that are in atari, or plays elsewhere. A target with 3 liberties escapes (4 in a net,
  // where a stone can have 3 for a moment and still be trapped).
  function caught(b, ts, def) { return ts.some(function (t) { return b.s[t] !== def; }); }
  function fewestLibs(b, ts, def) {
    var m = 99;
    ts.forEach(function (t) { if (b.s[t] === def) m = Math.min(m, libs(b, t)); });
    return m;
  }
  function attackMoves(b, ts, def, near) {
    var set = {};
    ts.forEach(function (t) {
      if (b.s[t] !== def) return;
      group(b, t).libs.forEach(function (l) {
        set[l] = 1;
        if (near) nbrs(b.n, l).forEach(function (k) { if (!b.s[k]) set[k] = 1; });
      });
    });
    return Object.keys(set).map(Number).sort(function (x, y) { return x - y; });
  }
  function defendMoves(b, ts, def) {
    var set = {}, att = other(def);
    ts.forEach(function (t) {
      if (b.s[t] !== def) return;
      var g = group(b, t);
      g.libs.forEach(function (l) { set[l] = 1; });
      g.stones.forEach(function (s) {
        nbrs(b.n, s).forEach(function (k) {
          if (b.s[k] !== att) return;
          var a = group(b, k);
          if (a.libs.length === 1) set[a.libs[0]] = 1;
        });
      });
    });
    return Object.keys(set).map(Number).sort(function (x, y) { return x - y; }).concat([-1]);
  }
  function canCatch(b, ts, att, ko, d, near, budget) {
    if (d <= 0 || --budget.n < 0) return false;
    var def = other(att), ms = attackMoves(b, ts, def, near);
    for (var k = 0; k < ms.length; k++) {
      var r = play(b, ms[k], att, ko);
      if (!r.ok) continue;
      if (caught(r.b, ts, def)) return true;
      if (d === 1 || fewestLibs(r.b, ts, def) > (near ? 3 : 2)) continue;
      if (!holds(r.b, ts, att, r.ko, d - 1, near, budget)) return true;
    }
    return false;
  }
  // Defender to move: true if some answer keeps every target alive for d more attacker moves.
  function holds(b, ts, att, ko, d, near, budget) {
    var def = other(att), ms = defendMoves(b, ts, def);
    for (var k = 0; k < ms.length; k++) {
      var nb = b, nko = -1;
      if (ms[k] >= 0) {
        var r = play(b, ms[k], def, ko);
        if (!r.ok) continue;
        nb = r.b; nko = r.ko;
      }
      if (fewestLibs(nb, ts, def) >= (near ? 4 : 3)) return true;
      if (!canCatch(nb, ts, att, nko, d, near, budget)) return true;
    }
    return false;
  }
  function budget() { return { n: 400000 }; }
  // Fewest attacker moves to capture (attacker to move), or Infinity if not within maxD.
  function catchDepth(b, ts, att, ko, maxD, near) {
    for (var d = 1; d <= maxD; d++) if (canCatch(b, ts, att, ko, d, near, budget())) return d;
    return Infinity;
  }
  // After an attacker move: the defender's most stubborn answer. depth = attacker moves still allowed.
  function bestDefence(b, ts, att, ko, depth, near) {
    var def = other(att), best = null;
    defendMoves(b, ts, def).forEach(function (m) {
      var nb = b, nko = -1;
      if (m >= 0) {
        var r = play(b, m, def, ko);
        if (!r.ok) return;
        nb = r.b; nko = r.ko;
      }
      var esc = fewestLibs(nb, ts, def) >= (near ? 4 : 3), need = esc ? Infinity : catchDepth(nb, ts, att, nko, depth, near);
      if (!best || need > best.need || (need === best.need && best.move < 0 && m >= 0)) best = { move: m, b: nb, ko: nko, need: need };
    });
    return best;
  }

  // ---------- puzzles ----------
  // Every puzzle is played by Black (the child). setup() builds the start; answers() lists what counts as solved.
  function setup(pz) {
    var b = make(pz.size, pz.black, pz.white);
    return { b: b, ko: pz.ban ? idx(pz.size, pz.ban) : -1 };
  }
  function pts(pz, list) { return (list || []).map(function (p) { return idx(pz.size, p); }); }
  function safe(b, i, ko) { return b.s[i] && catchDepth(b, [i], other(b.s[i]), ko, 3, false) === Infinity; }
  // Does Black's move m solve a one-move puzzle? (Chase and ko puzzles go step by step in the app.)
  function solves(pz, b, ko, m) {
    var r = play(b, m, BLACK, ko);
    if (!r.ok) return false;
    var nb = r.b, ts = pts(pz, pz.targets);
    switch (pz.type) {
      case 'capture': return caught(nb, ts, WHITE);
      case 'atari': return r.libs >= 2 && ts.some(function (t) { return nb.s[t] === WHITE && libs(nb, t) === 1; });
      case 'escape': return safe(nb, ts[0], r.ko);
      case 'connect': {
        var g = group(nb, ts[0]);
        return g.libs.length >= 2 && ts.every(function (t) { return g.stones.indexOf(t) >= 0; });
      }
      case 'live': return alive(nb, ts[0]);
      case 'kill': {
        if (nb.s[ts[0]] !== WHITE) return true;
        var replies = legal(nb, WHITE, r.ko);
        return !alive(nb, ts[0]) && replies.every(function (w) { var q = play(nb, w, WHITE, r.ko); return !alive(q.b, ts[0]); });
      }
      case 'chase': {

      '<label>' + G.ai + ' <select id="gAi"><option value="gentle">' + G.gentle + '</option><option value="tricky">' + G.tricky + '</option></select></label>' +
      '</div><p class="small">' + esc(G.progress(stickerCount(), state.wins, APP_VERSION)) + '</p>' +
      '<div class="row" style="justify-content:flex-start"><button class="btn small" id="gTest">' + G.test + '</button>' +
      '<button class="btn small" id="gReset">' + G.reset + '</button></div></div>';
    $('gRate').value = String(s.rate); if ($('gRate').selectedIndex < 0) $('gRate').value = '0.9';
    $('gAi').value = s.ai;
    function bind(id, key, conv) { $(id).addEventListener('change', function (e) { s[key] = conv(e.target); save(); }); }
    bind('gVoice', 'voice', function (el) { return el.checked; });
    bind('gSfx', 'sfx', function (el) { return el.checked; });
    bind('gRate', 'rate', function (el) { return +el.value; });
    bind('gCoords', 'coords', function (el) { return el.checked; });
    bind('gUnlock', 'unlockAll', function (el) { return el.checked; });
    bind('gAi', 'ai', function (el) { return el.value; });
    on('gTest', function () { audio(); speak(tr('testVoice')); });
    on('gReset', function () {
      if (!confirm(G.confirm)) return;
      state.stars = {}; state.stickers = {}; state.wins = 0; state.games = 0; save();
      renderGuide();
    });
  }

  var app = $('app');
  renderHome();
})();
</script>
</body>
</html>
